# AspireOllama Docker Compose — Production
# Copy docker-compose.env.example to .env and fill in secrets before running
# Usage: docker compose up --build -d
#
# TLS options (set in .env):
#   USE_CLOUDFLARE=true  → Cloudflared sidecar handles TLS, Let's Encrypt disabled
#   USE_CLOUDFLARE=false → Let's Encrypt enabled (requires LETSENCRYPT_DOMAIN)
#
# Service discovery & connection strings are in appsettings.Docker.json per project.
# Only secrets and deployment config are passed via environment variables.


x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.nr-data.net
  OTEL_EXPORTER_OTLP_HEADERS: api-key=${NEW_RELIC_LICENSE_KEY}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_SERVICE_NAMESPACE: AspireOllama
  OTEL_SERVICE_VERSION: "1.0.0"
  OTEL_DEPLOYMENT_ENVIRONMENT: docker
  OTEL_PROPAGATORS: tracecontext,baggage

x-azure-ad-backend: &azure-ad-backend
  AzureAd__Instance: https://login.microsoftonline.com/
  AzureAd__TenantId: ${AZUREAD_TENANT_ID}
  AzureAd__ClientId: ${AZUREAD_BACKEND_CLIENT_ID}
  AzureAd__ClientSecret: ${AZUREAD_BACKEND_CLIENT_SECRET}
  AzureAd__Audience: ${AZUREAD_AUDIENCE}
  Gateway__SharedSecret: ${GATEWAY_SHARED_SECRET}

x-dotnet-docker: &dotnet-docker
  ASPNETCORE_ENVIRONMENT: Docker

services:
  # ============================================================
  # Infrastructure
  # ============================================================

  redis:
    build: { context: docker, dockerfile: redis.Dockerfile }
    volumes: [redis-data:/data]
    restart: unless-stopped
    networks: [internal]

  mongodb:
    build: { context: docker, dockerfile: mongodb.Dockerfile }
    volumes: [mongodb-data:/data/db]
    restart: unless-stopped
    networks: [internal]

  qdrant:
    build: { context: docker, dockerfile: qdrant.Dockerfile }
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped
    networks: [internal]

  ollama:
    build: { context: docker, dockerfile: ollama.Dockerfile }
    volumes: [ollama-data:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks: [internal]

  ollama-init:
    image: curlimages/curl:latest
    depends_on:
      ollama: { condition: service_healthy }
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "Pulling Qwen3 32B..." &&
        curl -X POST http://ollama:11434/api/pull -d '{"name":"qwen3:32b"}' &&
        echo "Pulling Qwen2.5-VL 32B..." &&
        curl -X POST http://ollama:11434/api/pull -d '{"name":"qwen2.5vl:32b"}' &&
        echo "Pulling nomic-embed-text..." &&
        curl -X POST http://ollama:11434/api/pull -d '{"name":"nomic-embed-text"}' &&
        echo "All models pulled."
    networks: [internal]

  # ============================================================
  # OTEL Collector (infrastructure telemetry)
  # Collects logs + container stats from MongoDB, Qdrant, Ollama, Redis
  # Forwards to New Relic under service.namespace=AspireOllama
  # ============================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    user: "0:0"
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}
    depends_on:
      mongodb: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      ollama: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # Cloudflare Tunnel
  # ============================================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped
    networks: [external]

  # ============================================================
  # YARP Gateway
  # ============================================================

  gateway:
    build: { context: ., args: { PROJECT_DIR: AspireOllama.Gateway, PROJECT_NAME: AspireOllama.Gateway } }
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:8080"
      - "${GATEWAY_HTTPS_PORT:-443}:8443"
    environment:
      <<: [*otel-env, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.Gateway
      USE_CLOUDFLARE: ${USE_CLOUDFLARE:-false}
      LettuceEncrypt__AcceptTermsOfService: "true"
      LettuceEncrypt__DomainNames__0: ${LETSENCRYPT_DOMAIN:-}
      LettuceEncrypt__EmailAddress: ${LETSENCRYPT_EMAIL:-}
    volumes: [letsencrypt-certs:/root/.aspnet/DataProtection-Keys]
    depends_on:
      webfrontend: { condition: service_healthy }
      apiservice: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal, external]

  # ============================================================
  # Web Frontend
  # ============================================================

  webfrontend:
    build: { context: ., args: { PROJECT_DIR: AspireOllama.Web, PROJECT_NAME: AspireOllama.Web } }
    environment:
      <<: [*otel-env, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.Web
      AzureAd__Instance: https://login.microsoftonline.com/
      AzureAd__TenantId: ${AZUREAD_TENANT_ID}
      AzureAd__ClientId: ${AZUREAD_WEB_CLIENT_ID}
      AzureAd__ClientSecret: ${AZUREAD_WEB_CLIENT_SECRET}
      AzureAd__Audience: ${AZUREAD_AUDIENCE}
      AzureAd__CallbackPath: /signin-oidc
      AzureAd__SignedOutCallbackPath: /signout-callback-oidc
      Gateway__SharedSecret: ${GATEWAY_SHARED_SECRET}
      DownstreamApis__ApiService__Scopes__0: ${AZUREAD_AUDIENCE}/.default
      DownstreamApis__McpServer__Scopes__0: ${AZUREAD_AUDIENCE}/.default
      DownstreamApis__A2AAgents__Scopes__0: ${AZUREAD_AUDIENCE}/.default
    depends_on:
      redis: { condition: service_healthy }
      apiservice: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # API Service
  # ============================================================

  apiservice:
    build: { context: ., args: { PROJECT_DIR: AspireOllama.ApiService, PROJECT_NAME: AspireOllama.ApiService } }
    environment:
      <<: [*otel-env, *azure-ad-backend, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.ApiService
      Tools__EnableWebSearch: "true"
      Tools__WebSearch__SerpApiKey: ${SERPAPI_KEY}
    depends_on:
      mongodb: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
      mcpserver: { condition: service_healthy }
      coordinator-agent: { condition: service_healthy }
      planner-agent: { condition: service_healthy }
      reviewer-agent: { condition: service_healthy }
      research-agent: { condition: service_healthy }
      code-agent: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # MCP Server
  # ============================================================

  mcpserver:
    build: { context: ., args: { PROJECT_DIR: AspireOllama.McpServer, PROJECT_NAME: AspireOllama.McpServer } }
    environment:
      <<: [*otel-env, *azure-ad-backend, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.McpServer
    restart: unless-stopped
    networks: [internal]

  # ============================================================
  # A2A Agents
  # ============================================================

  coordinator-agent:
    build: { context: ., args: { PROJECT_DIR: A2A/AspireOllama.A2A.CoordinatorAgent, PROJECT_NAME: AspireOllama.A2A.CoordinatorAgent } }
    environment:
      <<: [*otel-env, *azure-ad-backend, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.A2A.CoordinatorAgent
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [internal]

  planner-agent:
    build: { context: ., args: { PROJECT_DIR: A2A/AspireOllama.A2A.PlannerAgent, PROJECT_NAME: AspireOllama.A2A.PlannerAgent } }
    environment:
      <<: [*otel-env, *azure-ad-backend, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.A2A.PlannerAgent
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [internal]

  reviewer-agent:
    build: { context: ., args: { PROJECT_DIR: A2A/AspireOllama.A2A.ReviewerAgent, PROJECT_NAME: AspireOllama.A2A.ReviewerAgent } }
    environment:
      <<: [*otel-env, *azure-ad-backend, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.A2A.ReviewerAgent
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [internal]

  research-agent:
    build: { context: ., args: { PROJECT_DIR: A2A/AspireOllama.A2A.ResearchAgent, PROJECT_NAME: AspireOllama.A2A.ResearchAgent } }
    environment:
      <<: [*otel-env, *azure-ad-backend, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.A2A.ResearchAgent
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [internal]

  code-agent:
    build: { context: ., args: { PROJECT_DIR: A2A/AspireOllama.A2A.CodeAgent, PROJECT_NAME: AspireOllama.A2A.CodeAgent } }
    environment:
      <<: [*otel-env, *azure-ad-backend, *dotnet-docker]
      OTEL_SERVICE_NAME: AspireOllama.A2A.CodeAgent
    depends_on:
      ollama-init: { condition: service_completed_successfully }
    restart: unless-stopped
    networks: [internal]

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  redis-data:
  mongodb-data:
  qdrant-data:
  ollama-data:
  letsencrypt-certs:
